<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Emergency Tracking — Umbra</title>
  <meta name="description" content="Live emergency beacon tracking view for emergency contacts. Follows live location in real-time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-card: rgba(22, 30, 46, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-emergency: #f43f5e;
      --accent-safe: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 18px;
      background: rgba(10, 13, 20, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
    }

    .brand img {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.24));
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .status-badge.ended {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emergency);
      animation: pulse 1.5s infinite;
    }

    .status-badge.ended .status-dot {
      background: var(--accent-safe);
      animation: none;
    }

    #map {
      flex: 1;
      width: 100%;
      background: #0f172a;
    }

    .info-tray {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .info-tray-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .info-tray-header h3 {
      font-size: 14px;
      font-weight: 700;
    }

    .time-badge {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .tray-coords {
      font-family: monospace;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .tray-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-danger {
      background: var(--accent-emergency);
      color: white;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="umbra-shield.svg" alt="" aria-hidden="true">
      <span>Umbra Live Tracker</span>
    </div>
    <div id="status-pill" class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">LIVE ALERT</span>
    </div>
  </header>

  <div id="map"></div>

  <div class="info-tray">
    <div class="info-tray-header">
      <h3 id="target-title">Emergency Live Tracking</h3>
      <span id="last-updated-time" class="time-badge">Updating...</span>
    </div>

    <div id="coords-text" class="tray-coords">
      Acquiring GPS coordinates...
    </div>

    <div class="tray-actions">
      <a href="tel:112" class="btn btn-danger">📞 Call Police (112)</a>
      <a id="nav-link" href="#" target="_blank" rel="noopener" class="btn btn-secondary">🗺️ Directions</a>
    </div>
  </div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const API_BASE = "https://safety-app-o8sp.onrender.com";

    // Tracking links use ?token=<share token>; support a token in the path too.
    const urlParams = new URLSearchParams(window.location.search);
    const pathToken = window.location.pathname.split("/").pop();
    const token = urlParams.get("token") || (pathToken && pathToken.toLowerCase() !== "track.html" ? pathToken : null);
    const viewer = urlParams.get("v");

    let map = null;
    let marker = null;
    let accuracyCircle = null;
    let lastUpdateSeconds = 0;
    let pollInterval = null;
    let timerInterval = null;

    function initMap(lat, lon) {
      map = L.map('map', { zoomControl: false }).setView([lat, lon], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      // Custom pulsing red emergency icon
      const emergencyIcon = L.divIcon({
        className: 'custom-pulse-marker',
        html: `<div style="width: 22px; height: 22px; border-radius: 50%; background: #f43f5e; border: 3px solid white; box-shadow: 0 0 16px rgba(244,63,94,0.8);"></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });

      marker = L.marker([lat, lon], { icon: emergencyIcon }).addTo(map);
    }

    async function pollTracking() {
      if (!token) {
        document.getElementById("status-text").textContent = "INVALID LINK";
        document.getElementById("status-pill").className = "status-badge";
        document.getElementById("coords-text").textContent = "Error: Invalid tracking link (token missing).";
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/track/${token}${viewer ? "?v=" + encodeURIComponent(viewer) : ""}`);

        if (response.status === 404) {
          document.getElementById("status-pill").className = "status-badge";
          document.getElementById("status-text").textContent = "LINK UNAVAILABLE";
          document.getElementById("coords-text").textContent =
            "This tracking link is invalid or no longer active. This page cannot confirm the person's safety.";
          clearInterval(pollInterval);
          return;
        }

        if (!response.ok) {
          document.getElementById("status-pill").className = "status-badge";
          document.getElementById("status-text").textContent = "CONNECTION ISSUE";
          document.getElementById("coords-text").textContent = "Unable to reach live tracking right now. Retrying automatically...";
          return;
        }

        if (!(response.headers.get("content-type") || "").includes("application/json")) {
          throw new Error("Tracking service returned an invalid response");
        }

        const data = await response.json();

        if (data.message === "Waiting for first location") {
          document.getElementById("coords-text").textContent = "Alert is active. Waiting for device to acquire first GPS coordinate...";
          return;
        }

        const lat = data.latitude;
        const lon = data.longitude;
        lastUpdateSeconds = 0;

        document.getElementById("coords-text").textContent = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
        document.getElementById("nav-link").href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

        if (!map) {
          initMap(lat, lon);
        } else {
          marker.setLatLng([lat, lon]);
          map.panTo([lat, lon]);
        }
      } catch (err) {
        console.warn("Tracking fetch error:", err);
      }
    }

    if (token) {
      pollTracking();
      pollInterval = setInterval(pollTracking, 5000);

      // Update relative time badge every second
      timerInterval = setInterval(() => {
        lastUpdateSeconds++;
        document.getElementById("last-updated-time").textContent = `Updated ${lastUpdateSeconds}s ago`;
      }, 1000);
    } else {
      pollTracking();
    }
  </script>
</body>
</html>
